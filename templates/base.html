<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Othello Arena{% endblock %}</title>
{% load static %}
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c0a;--surface:#0f1510;--surface2:#162018;--border:#1e2e22;--green:#2d7a4f;--green-dim:#1a4a2f;--green-light:#4cbe7a;--green-glow:rgba(45,122,79,0.3);--text:#deeee5;--text-dim:#6a8a72;--win:#4cbe7a;--loss:#e85555;--draw:#7a9aaf;--radius:6px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;min-height:100vh;line-height:1.6;}
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100;}
.nav-brand{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.12em;color:var(--green-light);text-decoration:none;display:flex;align-items:center;gap:.6rem;}
.nav-token{width:18px;height:18px;border-radius:50%;border:2px solid var(--green-light);}
.nav-token.b{background:#111;}
.nav-token.w{background:#f0f0ee;}
.nav-links{display:flex;align-items:center;gap:1.5rem;}
.nav-links a{color:var(--text-dim);text-decoration:none;font-size:.82rem;font-weight:500;transition:color .2s;}
.nav-links a:hover{color:var(--text);}
.nav-elo{background:linear-gradient(135deg,var(--green-dim),var(--green));color:#fff;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:20px;}
.messages-wrap{padding:.75rem 2rem 0;}
.msg{padding:.6rem 1rem;margin-bottom:.5rem;border-left:3px solid var(--green);background:rgba(45,122,79,0.08);font-size:.85rem;}
.btn{display:inline-block;padding:.55rem 1.4rem;background:transparent;color:var(--green-light);border:1px solid var(--green-dim);font-family:'Inter',sans-serif;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:all .2s;border-radius:var(--radius);}
.btn:hover{background:rgba(76,190,122,0.1);border-color:var(--green-light);}
.btn-primary{background:linear-gradient(135deg,var(--green-dim),var(--green));color:#fff;border-color:var(--green);}
.btn-primary:hover{filter:brightness(1.15);}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-brand"><div class="nav-token b"></div><div class="nav-token w"></div>Othello</a>
  <div class="nav-links">
    <a href="/game/">Play</a>
    {% if user.is_authenticated %}<a href="/profile/">Profile</a><span class="nav-elo">ELO {{ user.elo }}</span><a href="/accounts/logout/">Logout</a>
    {% else %}<a href="/accounts/login/">Login</a><a href="/accounts/register/">Register</a>{% endif %}
  </div>
</nav>
{% if messages %}<div class="messages-wrap">{% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}</div>{% endif %}
{% block content %}{% endblock %}
</body>
</html>
